<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM卡管理平台 - SIM卡管理</title>
  <style>
    :root {
      --blue: #1687e8;
      --blue-light: #edf6ff;
      --blue-button: #2f91f1;
      --green: #06a77d;
      --bg: #f5f7fb;
      --border: #e6ebf2;
      --input-border: #dfe5ee;
      --text: #333;
      --muted: #7e8997;
      --table-text: rgb(96, 98, 102);
      --shadow: 0 8px 28px rgba(20, 44, 80, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--bg);
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
    }

    button {
      color: inherit;
      font: inherit;
      border: 0;
      cursor: pointer;
      background: transparent;
    }

    input {
      font: inherit;
    }

    .topbar {
      position: relative;
      z-index: 20;
      height: 59px;
      display: flex;
      align-items: center;
      color: #fff;
      background: linear-gradient(90deg, #1687e8 0%, #0b9bc9 52%, #02a99c 100%);
      box-shadow: 0 1px 4px rgba(18, 96, 151, 0.18);
    }

    .logo {
      flex: 0 0 220px;
      height: 59px;
      display: flex;
      align-items: center;
      padding-left: 19px;
      gap: 11px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .diamond {
      width: 10px;
      height: 10px;
      transform: rotate(45deg);
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.72);
    }

    .top-actions {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-left: auto;
      padding-right: 21px;
    }

    .bell {
      position: relative;
      width: 16px;
      height: 18px;
    }

    .bell::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 11px;
      height: 12px;
      border: 1.3px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px 8px 4px 4px;
    }

    .bell::after {
      content: "";
      position: absolute;
      left: 6px;
      bottom: 1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
    }

    .dot {
      position: absolute;
      top: 1px;
      right: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff605e;
      border: 1px solid #fff;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 25px;
      height: 25px;
      line-height: 25px;
      text-align: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .layout {
      height: calc(100vh - 59px);
      display: flex;
    }

    .sidebar {
      flex: 0 0 226px;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      color: #4d5664;
      background: #fff;
      border-right: 1px solid #e5eaf1;
    }

    .menu-title {
      position: relative;
      width: 100%;
      height: 47px;
      padding: 0 17px 0 19px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 13px;
    }

    .menu-title.active {
      color: var(--blue);
      background: #eef6ff;
    }

    .menu-title.active::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: var(--blue);
    }

    .device-icon {
      position: relative;
      display: inline-block;
      width: 15px;
      height: 14px;
      border: 1.3px solid #5e6d80;
      border-radius: 2px;
    }

    .device-icon::after {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 2px;
      height: 1px;
      background: #5e6d80;
    }

    .menu-arrow {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-right: 1px solid #8b96a6;
      border-bottom: 1px solid #8b96a6;
      transform: rotate(45deg);
      transition: transform 0.2s;
    }

    .collapsed .menu-arrow {
      transform: rotate(-45deg);
    }

    .submenu {
      max-height: 240px;
      overflow: hidden;
      transition: max-height 0.22s ease;
    }

    .collapsed .submenu {
      max-height: 0;
    }

    .submenu-btn {
      position: relative;
      display: block;
      height: 39px;
      width: 100%;
      padding-left: 45px;
      color: #667182;
      text-align: left;
    }

    .submenu-btn.active {
      color: var(--blue);
      background: #eef6ff;
    }

    .submenu-btn.active::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: var(--blue);
    }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .breadcrumb-bar {
      flex: 0 0 42px;
      height: 42px;
      display: flex;
      align-items: stretch;
      padding-left: 12px;
      background: #fff;
      border-bottom: 1px solid #e6ebf2;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .breadcrumb-item {
      position: relative;
      min-width: 112px;
      height: 42px;
      padding: 0 30px 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #667182;
      border-right: 1px solid #edf1f5;
      border-bottom: 2px solid transparent;
      background: #fff;
      white-space: nowrap;
    }

    .breadcrumb-item:hover {
      color: var(--blue);
      background: #f7fbff;
    }

    .breadcrumb-item.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      background: #fff;
      font-weight: 500;
    }

    .breadcrumb-close {
      position: absolute;
      top: 6px;
      right: 7px;
      width: 16px;
      height: 16px;
      color: #9aa4b1;
      line-height: 15px;
      text-align: center;
      border-radius: 50%;
    }

    .breadcrumb-close:hover {
      color: #fff;
      background: #b8c2cf;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: flex;
    }

    .page-doc-sidebar {
      flex: 0 0 0;
      width: 0;
      height: 100%;
      overflow: hidden;
      color: #4b5563;
      background: #fff;
      border-left: 0 solid #e6ebf2;
      box-shadow: none;
      transition: flex-basis 0.22s ease, width 0.22s ease, border-color 0.22s ease;
    }

    body.page-doc-open .page-doc-sidebar {
      flex-basis: 440px;
      width: 440px;
      border-left-width: 1px;
      box-shadow: -6px 0 18px rgba(29, 58, 96, 0.04);
    }

    body.page-doc-open .filter-grid {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    body.page-doc-open .resource-filter {
      grid-template-columns: minmax(140px, 180px) minmax(160px, 220px);
    }

    body.page-doc-open .resource-filter-actions {
      grid-column: 1 / -1;
      justify-content: flex-start;
    }

    .page-doc-trigger {
      position: fixed;
      z-index: 45;
      top: 50%;
      right: 0;
      width: 32px;
      min-height: 92px;
      padding: 10px 7px;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.25;
      background: #2f91f1;
      border-radius: 6px 0 0 6px;
      box-shadow: 0 6px 16px rgba(22, 135, 232, 0.22);
      transform: translateY(-50%);
      transition: right 0.22s ease, background 0.18s ease, box-shadow 0.18s ease;
      writing-mode: vertical-rl;
    }

    .page-doc-trigger:hover {
      background: #1687e8;
      box-shadow: 0 8px 20px rgba(22, 135, 232, 0.28);
    }

    body.page-doc-open .page-doc-trigger {
      right: 440px;
    }

    .page-doc-panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 440px;
    }

    .page-doc-head {
      height: 54px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf1f5;
      background: #fbfcfe;
    }

    .page-doc-head h2 {
      margin: 0;
      color: #1f2d3d;
      font-size: 15px;
      font-weight: 600;
    }

    .page-doc-close {
      width: 24px;
      height: 24px;
      color: #98a3b3;
      border-radius: 50%;
    }

    .page-doc-close:hover {
      color: #fff;
      background: #b8c2cf;
    }

    .page-doc-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 22px;
    }

    .page-doc-tabs {
      height: 42px;
      padding: 0 18px;
      display: flex;
      align-items: flex-end;
      gap: 26px;
      background: #fff;
      border-bottom: 1px solid #edf1f5;
    }

    .page-doc-tab {
      height: 40px;
      padding: 0 2px;
      color: #667182;
      border-bottom: 2px solid transparent;
      font-size: 13px;
    }

    .page-doc-tab:hover {
      color: var(--blue);
    }

    .page-doc-tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 500;
    }

    .page-doc-summary {
      margin: 0 0 16px;
      color: #657182;
      line-height: 1.8;
    }

    .page-doc-section {
      padding: 13px 0 14px;
      border-top: 1px solid #edf1f5;
    }

    .page-doc-title {
      position: relative;
      margin-bottom: 10px;
      padding-left: 10px;
      color: #1f2d3d;
      font-size: 13px;
      font-weight: 600;
    }

    .page-doc-title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      width: 3px;
      height: 12px;
      background: var(--blue);
      border-radius: 2px;
    }

    .page-doc-list {
      margin: 0;
      padding-left: 16px;
      color: #5e6a7b;
      line-height: 1.8;
    }

    .page-doc-list li + li {
      margin-top: 4px;
    }

    .page-doc-fields {
      display: grid;
      gap: 8px;
    }

    .page-doc-note-list {
      display: grid;
      gap: 10px;
    }

    .page-doc-note {
      padding: 10px 12px;
      border: 1px solid #e7edf5;
      border-radius: 4px;
      background: #fbfdff;
    }

    .page-doc-note-entry + .page-doc-note-entry {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #edf1f5;
    }

    .page-doc-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 7px;
    }

    .page-doc-note-text {
      color: #5e6a7b;
      line-height: 1.75;
    }

    .page-doc-field {
      width: 100%;
      padding: 9px 10px;
      text-align: left;
      border: 1px solid #e7edf5;
      border-radius: 4px;
      background: #fbfdff;
    }

    .page-doc-field:hover {
      color: var(--blue);
      border-color: #bddcff;
      background: #f4f9ff;
    }

    .page-doc-field strong {
      display: block;
      margin-bottom: 3px;
      color: #344253;
      font-size: 13px;
      font-weight: 600;
    }

    .page-doc-field:hover strong {
      color: var(--blue);
    }

    .page-doc-field span {
      display: block;
      color: #7d8897;
      line-height: 1.6;
    }

    .page-doc-field-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .page-doc-field-title .page-doc-meta {
      justify-content: flex-end;
      margin-bottom: 0;
    }

    .page-doc-version {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      color: var(--blue);
      font-style: normal;
      font-size: 12px;
      font-weight: 400;
      background: #edf6ff;
      border: 1px solid #cfe7ff;
      border-radius: 10px;
    }

    .doc-badge {
      display: inline-flex;
      align-items: center;
      height: 18px;
      margin-right: 6px;
      padding: 0 6px;
      color: #c87800;
      background: #fff7e6;
      border: 1px solid #ffd99a;
      border-radius: 10px;
      font-size: 12px;
    }

    [data-doc-field].doc-field-highlight {
      outline: 2px solid rgba(47, 145, 241, 0.7);
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(47, 145, 241, 0.13);
      background: #f0f8ff !important;
      transition: outline 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .page-panel {
      min-height: 100%;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .inner-tabs {
      height: 44px;
      padding: 0 18px;
      display: flex;
      align-items: flex-end;
      gap: 26px;
      background: #fff;
      border-bottom: 1px solid #edf1f5;
    }

    .inner-tab {
      height: 42px;
      padding: 0 2px;
      color: #667182;
      border-bottom: 2px solid transparent;
      font-size: 13px;
    }

    .inner-tab:hover {
      color: var(--blue);
    }

    .inner-tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 500;
    }

    .home-page {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
    }

    .metric-card {
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px 0 30px;
      background: #fff;
      border: 1px solid #eef2f6;
      box-shadow: 0 8px 20px rgba(35, 64, 100, 0.04);
    }

    .metric-icon {
      position: relative;
      width: 28px;
      height: 28px;
      border: 2px solid #48a5ff;
      border-radius: 50%;
      background: #f0f8ff;
    }

    .metric-icon::before,
    .metric-icon::after {
      content: "";
      position: absolute;
      background: currentColor;
    }

    .metric-icon.card {
      color: #7b8796;
      width: 22px;
      height: 26px;
      border-radius: 5px;
      border-color: #7b8796;
    }

    .metric-icon.card::before {
      left: 5px;
      right: 5px;
      top: 6px;
      height: 2px;
      box-shadow: 0 5px 0 currentColor, 0 10px 0 currentColor;
    }

    .metric-icon.active {
      color: #1687e8;
      border-style: dashed;
    }

    .metric-icon.flow {
      color: #43dba2;
      border-color: #6b8dff;
    }

    .metric-icon.flow::before {
      left: 6px;
      top: 13px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #43dba2;
      box-shadow: 10px 0 0 #43dba2;
    }

    .metric-icon.balance {
      color: #ff8b2f;
      border-color: #3b9cff;
    }

    .metric-icon.balance::before {
      left: 7px;
      top: 8px;
      width: 10px;
      height: 2px;
      background: #ff8b2f;
      box-shadow: 0 5px 0 #ff8b2f;
    }

    .metric-text {
      text-align: right;
    }

    .metric-label {
      margin-bottom: 6px;
      color: #9aa4b1;
      font-weight: 600;
    }

    .metric-value {
      color: #5d6470;
      font-size: 18px;
      font-weight: 700;
    }

    .home-middle {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(520px, 1fr);
      gap: 18px;
      min-height: 460px;
    }

    .home-panel {
      background: #fff;
      border: 1px solid #eef2f6;
      box-shadow: 0 8px 20px rgba(35, 64, 100, 0.035);
    }

    .donut-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 34px 30px;
    }

    .donut {
      position: relative;
      width: 172px;
      height: 172px;
      margin-bottom: 48px;
      border-radius: 50%;
      background: conic-gradient(#3bdc9a 0deg 298deg, #ff5a61 298deg 350deg, #4db8f7 350deg 351deg, #ff9d75 351deg 351deg, #268fff 351deg 352deg, #a98cff 352deg 359deg, #91a4b6 359deg 360deg);
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: #fff;
    }

    .donut-center {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .donut-value {
      font-size: 30px;
      line-height: 1.15;
      font-weight: 500;
    }

    .donut-label {
      margin-top: 6px;
      color: #8b95a5;
    }

    .status-legend {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      row-gap: 12px;
      column-gap: 28px;
      color: #6b7280;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 12px 1fr;
      grid-template-rows: auto auto;
      column-gap: 7px;
      align-items: center;
    }

    .legend-dot {
      grid-row: 1 / 3;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-value {
      color: #4f5866;
      font-weight: 500;
    }

    .resource-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 28px 40px;
    }

    .resource-box {
      min-height: 390px;
      border: 1px solid #e6ebf2;
      background: #fff;
      overflow: hidden;
    }

    .resource-title {
      margin-bottom: 14px;
      color: #2f9af1;
      font-size: 16px;
      font-weight: 600;
    }

    .resource-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .resource-head .resource-title {
      margin-bottom: 0;
    }

    .resource-history-page.monthly-traffic-page table {
      min-width: 1100px;
    }

    .chart-tabs {
      display: inline-flex;
      align-items: center;
      border: 1px solid #d9e2ed;
      border-radius: 3px;
      overflow: hidden;
      background: #fff;
    }

    .chart-tab {
      height: 30px;
      min-width: 58px;
      padding: 0 14px;
      color: #657182;
      background: #fff;
      border-right: 1px solid #d9e2ed;
    }

    .chart-tab:last-child {
      border-right: 0;
    }

    .chart-tab.active {
      color: #fff;
      background: #3b9cff;
      border-color: #3b9cff;
    }

    .resource-table {
      max-height: 302px;
      overflow: auto;
    }

    .resource-filter {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(140px, 180px) minmax(160px, 220px) minmax(160px, 220px) auto;
      gap: 10px;
      justify-content: start;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #e7ebf1;
      background: #fff;
    }

    .resource-filter label {
      min-width: 0;
    }

    .resource-filter .select-options {
      z-index: 25;
    }

    .resource-filter-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .resource-table table {
      min-width: 1080px;
      font-size: 12px;
    }

    .resource-table th,
    .resource-table td {
      border-right: 1px solid #edf1f5;
    }

    .resource-table th:last-child,
    .resource-table td:last-child {
      border-right: 0;
    }

    .chart-panel {
      min-height: 330px;
      padding: 18px 22px 22px;
    }

    .chart-head {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .chart-title {
      color: #2f9af1;
      font-size: 16px;
      font-weight: 600;
    }

    .line-chart {
      height: 220px;
      padding: 4px 6px 0;
    }

    .line-chart svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .filters {
      padding: 17px 18px 14px;
      border-bottom: 1px solid #f0f3f7;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      column-gap: 24px;
      row-gap: 14px;
      align-items: end;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #465163;
    }

    .required::before {
      content: "*";
      margin-right: 3px;
      color: #f05050;
    }

    .select {
      position: relative;
      height: 32px;
    }

    .select-trigger,

      function docListMarkup(items) {
        var groups = [];
        var ticketGroups = new Map();
        items.forEach(function (item) {
          var note = item && typeof item === "object" ? item : { text: item };
          var ticket = note.ticket == null ? "" : String(note.ticket).trim();
          var group = ticket ? ticketGroups.get(ticket) : null;
          if (!group) {
            group = { ticket: ticket, items: [] };
            groups.push(group);
            if (ticket) { ticketGroups.set(ticket, group); }
          }
          group.items.push(note);
        });
        return '<div class="page-doc-note-list">' + groups.map(function (group) {
          var versions = Array.from(new Set(group.items.map(function (item) { return item.version || "V1.0"; })));
          return '<div class="page-doc-note"' + (group.ticket ? ' data-doc-ticket="' + esc(group.ticket) + '"' : "") + '>' +

      function copyText(text) {
        var fallbackCopy = function () {
          return new Promise(function (resolve, reject) {
          var input = document.createElement("textarea");
          input.value = text;
          input.setAttribute("readonly", "readonly");
          input.style.position = "fixed";
          input.style.left = "-9999px";
          input.style.top = "0";
          document.body.appendChild(input);
          input.focus();
          input.select();
          input.setSelectionRange(0, input.value.length);
          try {
            document.execCommand("copy");
            window.__lastCopiedICCID = text;
            resolve();
          } catch (error) {
            window.__lastCopiedICCID = text;
            resolve();
          } finally {
            document.body.removeChild(input);
          }
          });
        };
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).catch(fallbackCopy);
        }
        return fallbackCopy();
      }

      function dateKey(date) {
        return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");

      function dateFromKey(value) {
        var parts = value.split("-").map(Number);

      function dateFilterToday() {
        return new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
      }

      function shiftDateMonths(date, months) {
        var first = new Date(date.getFullYear(), date.getMonth() + months, 1);
        var lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
        return new Date(first.getFullYear(), first.getMonth(), Math.min(date.getDate(), lastDay));
      }

      function dayMarkup(day, monthDate, focusDay, today) {
        var date = dateKey(new Date(monthDate.getFullYear(), monthDate.getMonth(), day));
        var className = "day";
        if (date === state.simDraftStart) { className += " start"; }
        if (date === state.simDraftEnd) { className += " end"; }
        if (state.simDraftStart && state.simDraftEnd && date > state.simDraftStart && date < state.simDraftEnd) { className += " in-range"; }
        return '<button class="' + className + '" role="gridcell" data-action="choose-sim-day" data-value="' + date +
          '" tabindex="' + (date === focusDay ? '0' : '-1') + '" aria-label="' + date.replace(/-/, "年").replace(/-/, "月") +
          '日" aria-selected="' + (className !== "day") + '"' + (date === today ? ' aria-current="date"' : '') + '>' + day + '</button>';
      }

      function calendarMonthMarkup(monthDate, index, focusDay, today) {
        var firstWeekDay = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1).getDay();
        var weeks = "";
        for (var week = 0; week < 6; week += 1) {
          var cells = "";
          for (var weekday = 0; weekday < 7; weekday += 1) {
            var date = new Date(monthDate.getFullYear(), monthDate.getMonth(), week * 7 + weekday - firstWeekDay + 1);
            cells += date.getMonth() === monthDate.getMonth() ? dayMarkup(date.getDate(), monthDate, focusDay, today) :
              '<span class="day outside" role="gridcell" aria-disabled="true">' + date.getDate() + '</span>';
          }
          weeks += '<div class="calendar-week-row" role="row">' + cells + '</div>';
        }
        return '<section class="date-calendar-month"><div class="calendar-header">' +
          (index === 0 ? '<button class="month-btn" data-action="sim-month-prev" aria-label="上一月">‹</button>' : '') +
          '<span id="dateMonthTitle' + index + '">' + monthDate.getFullYear() + ' 年 ' + String(monthDate.getMonth() + 1).padStart(2, "0") + ' 月</span>' +
          (index === 1 ? '<button class="month-btn next" data-action="sim-month-next" aria-label="下一月">›</button>' : '') +
          '</div><div class="week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
          '<div class="days" role="grid" aria-labelledby="dateMonthTitle' + index + '">' + weeks + '</div></section>';
      }

      function calendarMarkup() {
        var today = dateFilterToday();
        var left = new Date(state.simMonth.getFullYear(), state.simMonth.getMonth(), 1);
        var right = new Date(left.getFullYear(), left.getMonth() + 1, 1);
        var focusDay = state.dateFocusDay;
        if (!focusDay || (focusDay.slice(0, 7) !== dateKey(left).slice(0, 7) && focusDay.slice(0, 7) !== dateKey(right).slice(0, 7))) {
          focusDay = dateKey(left);
        }
        var summary = state.simDraftStart ? formatDate(state.simDraftStart) + ' - ' + (state.simDraftEnd ? formatDate(state.simDraftEnd) : '请选择结束日期') : '请选择开始日期和结束日期';
        return '<div class="date-popover range-date-popover" id="dateFilterPopover" role="dialog" aria-modal="false" aria-label="日期范围选择">' +
          '<div class="range-date-body"><nav class="date-shortcuts" aria-label="快捷日期范围">' + dateShortcuts.map(function (shortcut) {

              '" aria-pressed="' + (state.datePreset === shortcut.id) + '">' + shortcut.label + '</button>';
          }).join('') + '</nav><div class="date-months">' + calendarMonthMarkup(left, 0, focusDay, today) + calendarMonthMarkup(right, 1, focusDay, today) + '</div></div>' +
          '<div class="calendar-footer"><span class="date-range-summary" aria-live="polite">' + esc(summary) + '</span>' +
          '<button class="btn btn-gray" data-action="sim-date-clear">清空</button><button class="btn btn-primary" data-action="sim-date-confirm">确定</button></div></div>';
      }

      function positionDatePicker() {
        var popup = document.getElementById("dateFilterPopover");
        var definition = dateFilterDefinitions[state.dateTarget];
        var anchor = definition && document.querySelector('[data-action="' + definition.action + '"]');
        if (!popup || !anchor) { return; }
        var rect = anchor.getBoundingClientRect();
        var width = popup.offsetWidth;
        var height = popup.offsetHeight;
        var left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
        var top = rect.bottom + 6;
        if (top + height > window.innerHeight - 12 && rect.top - height - 6 >= 12) { top = rect.top - height - 6; }
        top = Math.max(12, Math.min(top, window.innerHeight - height - 12));
        popup.style.left = left + "px";
        popup.style.top = top + "px";
      }

      function renderDatePicker(focusSelector) {
        var layer = document.getElementById("datePickerLayer");
        var definition = dateFilterDefinitions[state.dateTarget];
        var anchor = definition && document.querySelector('[data-action="' + definition.action + '"]');
        if (state.simDateOpen && definition && !anchor) { state.simDateOpen = false; }
        if (!state.simDateOpen || !definition || !anchor) { layer.innerHTML = ""; return; }
        layer.innerHTML = calendarMarkup();
        positionDatePicker();
        var control = focusSelector && layer.querySelector(focusSelector);
        if (control) { control.focus({ preventScroll: true }); }
      }

      function dismissDatePicker() {
        state.simDateOpen = false;
        document.getElementById("datePickerLayer").innerHTML = "";

          trigger.setAttribute("aria-expanded", "false");
          trigger.removeAttribute("aria-controls");
        });
      }

        var definition = dateFilterDefinitions[state.dateTarget];
        dismissDatePicker();

        if (restoreFocus && anchor) { anchor.focus({ preventScroll: true }); }
      }

      function toggleDateFilter(target) {
        var definition = dateFilterDefinitions[target];
        if (state.simDateOpen && state.dateTarget === target) { closeDatePicker(true); return; }
        var query = state[definition.query];
        state.dateTarget = target;
        state.simDateOpen = true;
        state.openSelect = "";
        state.openCombo = "";
        state.simDraftStart = query[definition.start] || "";
        state.simDraftEnd = query[definition.end] || "";
        state.dateFocusDay = state.simDraftStart || dateFilterToday();
        state.datePreset = "";
        var date = dateFromKey(state.dateFocusDay);
        state.simMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        renderContent();
        var day = document.querySelector('#dateFilterPopover .day[tabindex="0"]');
        if (day) { day.focus({ preventScroll: true }); }
      }

      function applyDateShortcut(preset) {
        var today = dateFromKey(dateFilterToday());
        var start = new Date(today);
        var end = new Date(today);
        var months = { month: 1, quarter: 3, halfYear: 6, year: 12 }[preset];
        if (preset === "week") { start.setDate(start.getDate() - 6); }
        else if (months) { start = shiftDateMonths(today, -months); }
        else if (preset === "lastMonth") {
          start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
          end = new Date(today.getFullYear(), today.getMonth(), 0);
        } else if (preset === "thisMonth") {
          start = new Date(today.getFullYear(), today.getMonth(), 1);
          end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        }
        state.simDraftStart = dateKey(start);
        state.simDraftEnd = dateKey(end);
        state.dateFocusDay = state.simDraftStart;
        state.datePreset = preset;
        state.simMonth = new Date(start.getFullYear(), start.getMonth(), 1);
        renderDatePicker('[data-action="date-range-shortcut"][data-value="' + preset + '"]');

        if (offset < 0) { state.simMonth = new Date(date.getFullYear(), date.getMonth(), 1); }
        if (offset > 1) { state.simMonth = new Date(date.getFullYear(), date.getMonth() - 1, 1); }
        state.dateFocusDay = value;
        renderDatePicker('[data-action="choose-sim-day"][data-value="' + value + '"]');

      async function readActivationIccids(file) {
        if (!/\.(xlsx|xls)$/i.test(file.name)) { throw new Error("请上传XLS或XLSX格式的SIM卡文件"); }
        if (!file.size) { throw new Error("文件为空，请重新上传包含ICCID列的文件"); }
        if (file.size > 10 * 1024 * 1024) { throw new Error("文件不能超过10MB，请拆分后重新上传"); }
        var data = new Uint8Array(await file.arrayBuffer());
        var isXlsx = data[0] === 0x50 && data[1] === 0x4b;
        var isXls = data[0] === 0xd0 && data[1] === 0xcf && data[2] === 0x11 && data[3] === 0xe0;
        var isXmlXls = /^\s*(?:<\?xml[^>]*>\s*)?<Workbook[\s>]/i.test(new TextDecoder().decode(data.slice(0, 2048)).replace(/^\uFEFF/, ""));
        if (!isXlsx && !isXls && !isXmlXls) { throw new Error("文件内容不是有效的Excel表格，请重新上传XLS或XLSX文件"); }
        var workbook;
        try { workbook = XLSX.read(data, { type: "array", sheetRows: 10012 }); }
        catch (error) { throw new Error("无法读取Excel文件，请确认文件未损坏、未加密后重新上传"); }
        var sheet = workbook.Sheets[workbook.SheetNames[0]];
        if (!sheet || !sheet["!ref"]) { throw new Error("首个工作表为空，请填写ICCID后重新上传"); }
        var range = XLSX.utils.decode_range(sheet["!fullref"] || sheet["!ref"]);
        if (range.e.r > 10010 || range.e.c > 100) { throw new Error("表格范围过大，请仅保留ICCID及必要字段，单次上传不超过10000条码号"); }
        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "", blankrows: true });
        var headerIndex = rows.slice(0, 10).findIndex(function (row) {
          return row.some(function (cell) { return String(cell).trim().toUpperCase() === "ICCID"; });
        });
        if (headerIndex < 0) { throw new Error("首个工作表缺少ICCID列，请使用ICCID作为列名，码号按文本格式填写"); }
        var column = rows[headerIndex].findIndex(function (cell) { return String(cell).trim().toUpperCase() === "ICCID"; });
        var codes = [];
        rows.slice(headerIndex + 1).forEach(function (row, index) {
          var value = row[column];
          var code = String(value == null ? "" : value).trim();
          if (!code) { return; }
          if ((typeof value === "number" && !Number.isSafeInteger(value)) || /^[\d.]+e[+-]?\d+$/i.test(code)) {
            throw new Error("第" + (range.s.r + headerIndex + index + 2) + "行ICCID可能丢失精度，请在原始文件中按文本格式填写完整码号");
          }
          codes.push(code);
        });
        if (!codes.length) { throw new Error("文件中没有可处理的ICCID，请填写码号后重新上传"); }
        if (codes.length > 10000) { throw new Error("单次上传不能超过10000条码号，请拆分文件后重新上传"); }
        return codes;
      }

      async function detectBatchTaskFile() {
        if (!state.batchTaskAddOpen || state.batchTaskAddType !== "激活卡" || !state.batchTaskFile || state.batchTaskIccids) { return; }
        var file = state.batchTaskFile;
        var requestId = ++state.batchTaskFileDetectionId;
        state.batchTaskFileDetecting = true;
        state.batchTaskFileDetectionError = "";
        if (state.batchTaskAddErrorField === "batchTaskFile") {
          state.batchTaskAddError = "";
          state.batchTaskAddErrorField = "";
        }
        function isCurrent() {
          return requestId === state.batchTaskFileDetectionId && state.batchTaskAddOpen &&
            state.batchTaskFile === file && state.batchTaskAddType === "激活卡";
        }
        try {
          var codes = await readActivationIccids(file);
          if (!isCurrent()) { return; }
          state.batchTaskIccids = codes;
        } catch (error) {
          if (!isCurrent()) { return; }
          state.batchTaskFileDetectionError = error.message || "文件读取失败，请重新上传";
          state.batchTaskAddErrorField = "batchTaskFile";
          state.batchTaskAddError = state.batchTaskFileDetectionError;
        }
        if (!isCurrent()) { return; }
        state.batchTaskFileDetecting = false;
        // Update only file feedback so typing and open dropdowns keep their focus.
        var feedback = document.getElementById("batchTaskFileFeedback");
        if (feedback) { feedback.innerHTML = batchTaskFileFeedbackMarkup(); }
        prepareBatchTaskAddFields();
      }

        state.batchTaskAddErrorField = field;
        state.batchTaskAddError = message;
        renderOverlay();
        var target = field === "batchTaskFile" ? document.getElementById("batchTaskUpload") :
          document.querySelector('#overlay [data-action="toggle-select"][data-key="' + field + '"]');
        if (target) { target.focus(); }

      async function submitBatchTask() {
        if (state.batchTaskSubmitting) { return; }
        if (!state.batchTaskFile) { batchTaskAddError("batchTaskFile", "请先上传SIM卡文件"); return; }
        if (!state.batchTaskAddType) { batchTaskAddError("batchTaskAddType", "请选择操作类型"); return; }
        var group = state.groupRows.find(function (item) { return item.id === state.batchTaskAddGroup; });
        var activation = state.batchTaskAddType === "激活卡";
        if (activation && state.batchTaskFileDetecting) { return; }
        if (activation && !state.batchTaskIccids) {
          batchTaskAddError("batchTaskFile", state.batchTaskFileDetectionError || "请重新上传文件并完成ICCID数量检测");
          return;

        if (activation && !group) { batchTaskAddError("batchTaskAddGroup", "请选择所属群组"); return; }
        var task = {
          id: state.batchTaskRows.reduce(function (max, item) { return Math.max(max, item.id); }, 10000) + 1,
          batchNo: "BT" + dateFilterToday().replace(/-/g, "") + String(state.batchTaskRows.length + 1).padStart(4, "0"),

          operator: "admin", operatedAt: new Date().toLocaleString("sv-SE", { timeZone: "Asia/Shanghai" })
        };
        var requestId = ++state.batchTaskSubmissionId;
        if (activation) {
          state.batchTaskSubmitting = true;
          state.batchTaskAddError = "";
          state.batchTaskAddErrorField = "";
          state.openSelect = "";
          renderOverlay();
          try {
            var codes = state.batchTaskIccids.slice();
            if (requestId !== state.batchTaskSubmissionId || !state.batchTaskAddOpen) { return; }
            task.targetGroupId = group.id;
            task.targetGroupName = batchTaskGroupLabel(group);
            task.details = activationTaskDetails(task, codes, state.simRows);
            task.count = task.details.length;
            task.status = "已完成";
          } catch (error) {
            if (requestId !== state.batchTaskSubmissionId || !state.batchTaskAddOpen) { return; }
            state.batchTaskSubmitting = false;
            batchTaskAddError("batchTaskFile", error.message || "文件读取失败，请重新上传");
            return;
          }
        }
        state.batchTaskRows.unshift(task);
        state.batchTaskAddOpen = false;
        resetBatchTaskAdd();
        render();
        if (activation) {
          var failed = task.details.filter(function (row) { return row.status === "失败"; }).length;

        } else { toast("批量操作任务已新增"); }
        var opener = document.querySelector('[data-action="open-batch-task-add"]');
        if (opener) { opener.focus(); }

      function readSimDataResetCooldowns() {
        try {
          var data = JSON.parse(window.localStorage.getItem(simDataResetStorageKey) || "{}");
          if (!data || typeof data !== "object" || Array.isArray(data)) { return null; }
          var result = {};
          var now = Date.now();
          simRowsSeed.forEach(function (row) {
            var deadline = data[row.iccid];
            if (typeof deadline === "number" && isFinite(deadline) && deadline > now && deadline <= now + simDataResetCooldownMs) {
              result[row.iccid] = deadline;
            }
          });
          return result;
        } catch (error) { return null; }
      }

      function simDataResetRemaining(iccid) {
        return Math.max(0, Math.ceil(((state.simDataResetCooldowns[iccid] || 0) - Date.now()) / 1000));
      }

        var iccid = state.simDataResetConfirmIccid;
        if (!iccid) { return; }
        Object.assign(state.simDataResetCooldowns, readSimDataResetCooldowns() || {});
        if (state.simDataResetBusy[iccid] || simDataResetRemaining(iccid)) {
          closeSimDataResetDialog(true);
          toast("该卡3分钟内仅可重置1次，请等待冷却结束");

        state.simDataResetCooldowns[iccid] = Date.now() + simDataResetCooldownMs;
        state.simDataResetBusy[iccid] = true;
        try { window.localStorage.setItem(simDataResetStorageKey, JSON.stringify(state.simDataResetCooldowns)); } catch (error) {}

      function createResourceHistoryRows() {
        var current = dateFilterToday().slice(0, 7);
        var currentYear = Number(current.slice(0, 4));
        var records = [];
        resourceBaseRows().forEach(function (pool, index) {
          var usedCents = Math.round(Number(pool.used) * 100);
          var totalCents = Math.round((Number(pool.remain) + Number(pool.used)) * 100);
          for (var year = currentYear - 2; year <= currentYear; year += 1) {
            for (var month = 1; month <= 12; month += 1) {
              var period = year + "-" + String(month).padStart(2, "0");
              if (period > current) { continue; }
              var factor = 7600 + ((year * 12 + month + index * 3) % 17) * 125;
              records.push({
                poolId: index + 1, month: period, supplier: pool.supplier, group: pool.group, shortName: pool.shortName,
                totalCents: totalCents,
                usedCents: period === pool.time.slice(0, 7) ? usedCents : Math.round(usedCents * factor / 10000)
              });
            }
          }
        });
        return records;
      }

      function resourceHistoryYearOptions() {
        return Array.from(new Set(resourceHistoryRowsSeed.map(function (row) { return row.month.slice(0, 4); }))).sort().reverse();
      }

      function filteredResourceHistoryRows() {
        var mode = state.resourceHistoryMode;
        var q = state.resourceHistoryApplied[mode];
        var grouped = new Map();
        resourceHistoryRowsSeed.forEach(function (record) {
          if (mode === "month" ? record.month !== q.poolHistoryMonth : record.month.slice(0, 4) !== q.poolHistoryYear) { return; }
          if (!grouped.has(record.poolId)) {
            grouped.set(record.poolId, { supplier: record.supplier, group: record.group, shortName: record.shortName, totalCents: 0, usedCents: 0 });
          }
          var row = grouped.get(record.poolId);
          row.totalCents += record.totalCents;
          row.usedCents += record.usedCents;
        });
        return Array.from(grouped.values()).filter(function (row) {
          return (!q.poolHistorySupplier || row.supplier.toLowerCase().indexOf(q.poolHistorySupplier.toLowerCase()) !== -1) &&
            (!q.poolHistoryGroup || row.group.toLowerCase().indexOf(q.poolHistoryGroup.toLowerCase()) !== -1) &&
            (!q.poolHistoryShortName || row.shortName.toLowerCase().indexOf(q.poolHistoryShortName.toLowerCase()) !== -1);
        });
      }

      function searchResourceHistory() {
        var mode = state.resourceHistoryMode;

      function trafficHistoryYearOptions() {
        var years = new Set(state.monthlyTrafficRows.map(function (row) { return row.month.slice(0, 4); }));
        var currentYear = Number(trafficHistoryCurrentYear());
        for (var offset = 0; offset < 5; offset += 1) { years.add(String(currentYear - offset)); }
        return Array.from(years).sort(function (a, b) { return Number(b) - Number(a); });
      }

      function filteredTrafficHistoryRows() {
        var q = state.trafficHistoryApplied;
        var cards = new Map();
        state.monthlyTrafficRows.forEach(function (record) {
          if (record.month.slice(0, 4) !== q.trafficHistoryYear) { return; }
          if (!cards.has(record.iccid)) {
            var card = state.simRows.find(function (item) { return item.iccid === record.iccid; });
            cards.set(record.iccid, {
              msisdn: card ? card.msisdn : "--", iccid: record.iccid,
              vendor: record.vendor, merchant: record.merchant, carrier: record.carrier, months: {}
            });
          }
          var row = cards.get(record.iccid);
          row.months[record.month] = (row.months[record.month] || 0) + Math.round(record.monthFlow * 100);
        });
        var keyword = q.trafficHistoryKeyword.toLowerCase();
        return Array.from(cards.values()).filter(function (row) {
          return (!keyword || row.iccid.toLowerCase().indexOf(keyword) !== -1 || row.msisdn.toLowerCase().indexOf(keyword) !== -1) &&
            (!q.trafficHistoryVendor || row.vendor.indexOf(q.trafficHistoryVendor) !== -1) &&
            (!q.trafficHistoryMerchant || row.merchant.indexOf(q.trafficHistoryMerchant) !== -1) &&
            (!q.trafficHistoryCarrier || row.carrier === q.trafficHistoryCarrier);
        }).sort(function (a, b) { return a.iccid.localeCompare(b.iccid); });
      }

      function trafficHistoryColumns() {
        var columns = [
          { key: "msisdn", name: "MSISDN", width: 140 }, { key: "iccid", name: "ICCID", width: 240 },
          { key: "vendor", name: "供应商", width: 190 }, { key: "merchant", name: "商户名称", width: 150 },
          { key: "carrier", name: "运营商", width: 100 },
          { key: "annualFlow", name: "年度使用流量总计", width: 180 }
        ];
        for (var month = 1; month <= 12; month += 1) {
          var key = state.trafficHistoryApplied.trafficHistoryYear + "-" + String(month).padStart(2, "0");
          columns.push({ key: key, name: key + "（MB）", width: 130, isMonth: true });
        }
        return columns;
      }

      function trafficHistoryValue(row, column) {
        if (column.key === "annualFlow") {
          var totalCents = 0;
          for (var month = 1; month <= 12; month += 1) {
            var key = state.trafficHistoryApplied.trafficHistoryYear + "-" + String(month).padStart(2, "0");
            totalCents += row.months[key] || 0;
          }
          return (totalCents / 100).toFixed(3);
        }
        if (!column.isMonth) { return row[column.key]; }
        return Object.prototype.hasOwnProperty.call(row.months, column.key) ? (row.months[column.key] / 100).toFixed(3) : "--";
      }

            '<label>' + comboMarkup("trafficHistoryMerchant", q.trafficHistoryMerchant, simRowsSeed.map(function (row) { return row.merchant; }), "请输入或选择商户") + '</label>' +

      function refreshMonthlyTraffic(id, button) {
        var row = state.monthlyTrafficRows.find(function (item) { return item.id === id; });
        if (!row || state.monthlyTrafficRefreshing.has(id)) { return; }
        state.monthlyTrafficRefreshing.add(id);
        button.disabled = true;
        button.classList.add("spinning");
        button.parentNode.setAttribute("aria-busy", "true");
        window.setTimeout(function () {
          var latest = state.monthlyTrafficRows.find(function (item) {
            return item.iccid === row.iccid && item.month === monthlyTrafficRowsSeed[0].month;
          });
          row.currentUsage = latest ? latest.monthFlow : 0;
          row.updated = new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
          }).format(new Date());
          state.monthlyTrafficRefreshing.delete(id);
          if (state.activePage === "simMonthlyTraffic") {
            var usageCell = document.querySelector('[data-monthly-usage="' + id + '"]');
            var timeCell = document.querySelector('[data-monthly-updated="' + id + '"]');

            if (timeCell) { timeCell.textContent = row.updated; timeCell.title = row.updated; }

          }

      }

        var content = $("#content");

          var control = container.querySelector("input, .select-trigger");
          var key = control.dataset.key;
          var isOpen = container.classList.contains("open");
          var fieldName = { trafficVendor: "供应商", trafficMerchant: "商户", trafficCarrier: "运营商",
            monthlyTrafficVendor: "供应商", monthlyTrafficMerchant: "商户", monthlyTrafficCarrier: "运营商",
            trafficHistoryYear: "年份", trafficHistoryVendor: "供应商", trafficHistoryMerchant: "商户", trafficHistoryCarrier: "运营商",
            poolHistorySupplier: "供应商", poolHistoryGroup: "群组名称", poolHistoryYear: "年份",
            redlistVendor: "供应商", redlistExpiryStatus: "到期状态" }[key];
          control.setAttribute("aria-label", fieldName);
          control.setAttribute("aria-expanded", String(isOpen));
          control.setAttribute("aria-haspopup", "listbox");
          if (control.tagName === "INPUT") {
            control.setAttribute("role", "combobox");
            control.setAttribute("aria-autocomplete", "list");
          }
          var popup = container.querySelector(".select-options");
          if (popup) {
            popup.id = key + "Options";
            popup.setAttribute("role", "listbox");
            popup.setAttribute("aria-label", fieldName);
            control.setAttribute("aria-controls", popup.id);
            Array.prototype.forEach.call(popup.querySelectorAll(".select-option"), function (option) {
              option.setAttribute("role", "option");
              option.setAttribute("aria-selected", String(option.classList.contains("selected")));

          return [row.date, row.iccid + "\t", row.vendor, row.merchant, row.carrier, row.flow.toFixed(2), row.created];

        downloadTrafficCsv(lines, "SIM卡日流量.csv");

      function downloadTrafficCsv(lines, filename) {
        var csvCell = function (value) { return '"' + String(value).replace(/"/g, '""') + '"'; };
        var blob = new Blob(["\ufeff" + lines.map(function (line) { return line.map(csvCell).join(","); }).join("\r\n")], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);

      function esimWritableStats(rows) {
        var abnormalStatusMap = { "已停用": true, "已失效": true, "已销号": true, "其他": true };
        var written = 0;
        var abnormal = 0;
        var platformCounts = {};
        var platformStats = {};
        var unallocated = 0;
        allocatedBusinessPlatformOptions.forEach(function (item) {
          platformCounts[item] = 0;
          platformStats[item] = { allocated: 0, stocked: 0, unstocked: 0 };
        });
        rows.forEach(function (row) {
          var targetPlatform = row.allocationTargetPlatform || row.businessPlatform;
          if (platformStats[targetPlatform]) {
            platformStats[targetPlatform].allocated += 1;
            if (row.allocated === "是" && row.businessPlatform === targetPlatform) {
              platformStats[targetPlatform].stocked += 1;
            } else {
              platformStats[targetPlatform].unstocked += 1;
            }
          }
          if (row.allocated === "是" && platformCounts.hasOwnProperty(row.businessPlatform)) {
            platformCounts[row.businessPlatform] += 1;
          } else {
            unallocated += 1;
          }
          if (row.writeStatus === "写卡成功") {
            written += 1;
          } else if (abnormalStatusMap[row.cardStatus]) {
            abnormal += 1;
          }
        });
        return {
          total: rows.length,
          writable: Math.max(rows.length - written - abnormal, 0),
          nonWritable: written + abnormal,
          written: written,
          abnormal: abnormal,
          platformCounts: platformCounts,
          platformStats: platformStats,
          unallocated: unallocated
        };
      }

      function esimStatsMarkup(rows) {

            unstocked: itemStats.unstocked

          '<div class="esim-stat-body">' +
            '<section class="esim-stat-section">' +

      function redlistExpiryStatus(row) {
        return Date.parse(row.expiresAt.replace(" ", "T") + "+08:00") <= Date.now() ? "已到期" : "未到期";

      function filteredRedlistRows() {
        var q = state.redlistApplied;
        var name = q.redlistName.toLowerCase();
        var accountId = q.redlistAccountId.toLowerCase();
        return state.redlistRows.filter(function (row) {
          var start = row.startsAt.slice(0, 10);
          var end = row.expiresAt.slice(0, 10);
          return (!q.redlistVendor || row.vendor.indexOf(q.redlistVendor) !== -1) &&
            (!name || row.accountName.toLowerCase().indexOf(name) !== -1) &&
            (!accountId || row.accountId.toLowerCase().indexOf(accountId) !== -1) &&
            (!q.redlistStartFrom || start >= q.redlistStartFrom) &&
            (!q.redlistStartTo || start <= q.redlistStartTo) &&
            (!q.redlistEndFrom || end >= q.redlistEndFrom) &&
            (!q.redlistEndTo || end <= q.redlistEndTo) &&
            (q.redlistQuotaMin === "" || row.quota >= Number(q.redlistQuotaMin)) &&
            (q.redlistQuotaMax === "" || row.quota <= Number(q.redlistQuotaMax)) &&
            (!q.redlistExpiryStatus || redlistExpiryStatus(row) === q.redlistExpiryStatus);
        });
      }

      function searchRedlist() {
        var q = state.redlistQuery;
        var invalidKey = ["redlistQuotaMin", "redlistQuotaMax"].find(function (key) {
          var input = document.getElementById(key);
          return (input && input.validity.badInput) || (q[key] !== "" && (!isFinite(Number(q[key])) || Number(q[key]) < 0));
        });
        state.redlistError = invalidKey ? "红名单额度需为大于或等于0的有效数字" : "";
        if (!invalidKey && q.redlistQuotaMin !== "" && q.redlistQuotaMax !== "" && Number(q.redlistQuotaMin) > Number(q.redlistQuotaMax)) {
          invalidKey = "redlistQuotaMax";
          state.redlistError = "红名单额度最大值不能小于最小值";
        }
        if (invalidKey) {
          renderContent();
          var input = document.getElementById(invalidKey);
          input.setAttribute("aria-invalid", "true");
          input.setAttribute("aria-describedby", "redlistFilterError");
          input.focus();
          return;
        }
        state.redlistApplied = Object.assign({}, q, {
          redlistVendor: q.redlistVendor.trim(), redlistName: q.redlistName.trim(), redlistAccountId: q.redlistAccountId.trim()
        });
        state.redlistPage = 1;
        state.openSelect = "";
        state.openCombo = "";
        state.simDateOpen = false;
        renderContent();
        toast("已更新红名单账户查询结果");

      function prepareBatchTaskAddFields() {
        var dialog = document.querySelector(".batch-task-add-dialog");
        if (!dialog) { return; }
        Array.prototype.forEach.call(dialog.querySelectorAll("button, input, textarea"), function (control) {
          control.disabled = state.batchTaskSubmitting && control.dataset.action !== "close-batch-task-add";
          if (control.dataset.action === "confirm-batch-task-add" && state.batchTaskAddType === "激活卡" && state.batchTaskFileDetecting) { control.disabled = true; }
        });
        ["batchTaskAddType", "batchTaskAddGroup"].forEach(function (key) {
          var trigger = dialog.querySelector('[data-action="toggle-select"][data-key="' + key + '"]');
          if (!trigger) { return; }
          trigger.setAttribute("role", "combobox");
          trigger.setAttribute("aria-labelledby", key + "Label");
          trigger.setAttribute("aria-required", "true");
          trigger.setAttribute("aria-expanded", String(state.openSelect === key));
          trigger.setAttribute("aria-haspopup", "listbox");
          var popup = trigger.parentElement.querySelector(".select-options");
          if (popup) {
            popup.id = key + "Options";
            popup.setAttribute("role", "listbox");
            popup.setAttribute("aria-labelledby", key + "Label");
            trigger.setAttribute("aria-controls", popup.id);
            Array.prototype.forEach.call(popup.children, function (option) {
              option.setAttribute("role", "option");
              option.setAttribute("aria-selected", String(option.classList.contains("selected")));
              option.title = option.textContent;
            });
          }
        });
        var errorControl = state.batchTaskAddErrorField === "batchTaskFile" ? dialog.querySelector("#batchTaskUpload") :
          dialog.querySelector('[data-action="toggle-select"][data-key="' + state.batchTaskAddErrorField + '"]');
        if (errorControl && state.batchTaskAddError) {
          errorControl.setAttribute("aria-invalid", "true");
          errorControl.setAttribute("aria-describedby", "batchTaskAddError");
        }
        var groupControl = dialog.querySelector('[data-key="batchTaskAddGroup"]');
        if (groupControl && !groupControl.hasAttribute("aria-describedby")) { groupControl.setAttribute("aria-describedby", "batchTaskGroupHint"); }

      function showFloatingPopover(target, markup) {
        var popover = $("#floating-popover");
        var rect = target.getBoundingClientRect();
        popover.innerHTML = markup;
        popover.style.display = "block";
        popover.setAttribute("aria-hidden", "false");
        var width = popover.offsetWidth || 282;
        var left = rect.left + rect.width / 2 - width / 2;
        left = Math.max(12, Math.min(left, window.innerWidth - width - 12));
        var top = rect.bottom + 10;
        if (top + popover.offsetHeight > window.innerHeight - 12) {
          top = Math.max(12, rect.top - popover.offsetHeight - 10);
        }
        popover.style.left = left + "px";
        popover.style.top = top + "px";
      }

          state.batchTaskFileName = state.batchTaskFile.name;
          state.batchTaskFileDetectionId += 1;

          state.batchTaskFileDetecting = false;

          state.batchTaskAddErrorField = "";
          detectBatchTaskFile();
          renderOverlay();
          document.getElementById("batchTaskUpload").focus();
        } else if (event.target.id === "esimAllocateFile") {
          state.esimAllocateFileName = event.target.files && event.target.files[0] ? event.target.files[0].name : "";

      document.addEventListener("keydown", function (event) {
        var target = event.target;
        if (event.isComposing || event.keyCode === 229) { return; }
        if (state.batchTaskAddOpen) {
          var dialog = document.querySelector(".batch-task-add-dialog");
          if (event.key === "Escape") {
            event.preventDefault();
            if (state.openSelect) {
              var closedKey = state.openSelect;
              state.openSelect = "";
              renderOverlay();
              document.querySelector('#overlay [data-action="toggle-select"][data-key="' + closedKey + '"]').focus();
            } else { document.querySelector('#overlay [data-action="close-batch-task-add"]').click(); }
          } else if (event.key === "Tab") {
            var controls = Array.prototype.slice.call(dialog.querySelectorAll("button:not(:disabled), textarea:not(:disabled)"));
            var first = controls[0];
            var last = controls[controls.length - 1];
            if (event.shiftKey && target === first) { event.preventDefault(); last.focus(); }
            else if ((!event.shiftKey && target === last) || !dialog.contains(target)) { event.preventDefault(); first.focus(); }
          } else if (["ArrowDown", "ArrowUp", "Home", "End"].indexOf(event.key) !== -1 && target.closest(".select")) {
            event.preventDefault();
            var selectKey = target.dataset.key;
            if (state.openSelect !== selectKey) {
              state.openSelect = selectKey;
              renderOverlay();
            }
            var popup = document.getElementById(selectKey + "Options");
            var options = Array.prototype.slice.call(popup.querySelectorAll(".select-option"));
            var current = options.indexOf(target);
            var next = event.key === "Home" ? 0 : (event.key === "End" ? options.length - 1 :
              (event.key === "ArrowDown" ? (current + 1) % options.length : (current <= 0 ? options.length - 1 : current - 1)));
            if (options[next]) { options[next].focus(); options[next].scrollIntoView({ block: "nearest" }); }
          }
          return;
        }
        if (state.simDataResetConfirmIccid) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeSimDataResetDialog(true);
          } else if (event.key === "Tab") {
            var controls = Array.prototype.slice.call(document.querySelectorAll(".sim-reset-dialog button:not(:disabled)"));
            var first = controls[0];
            var last = controls[controls.length - 1];
            if (event.shiftKey && target === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && target === last) { event.preventDefault(); first.focus(); }
          }
          return;
        }
        if (event.key === "Escape" && (state.simResetInfoOpen || target.closest('[data-action="sim-reset-info"]'))) {
          hideManageStopPopover();
          event.preventDefault();
          return;
        }
        if (state.simDateOpen && dateFilterDefinitions[state.dateTarget]) {
          if (event.key === "Escape") {
            closeDatePicker(true);
            event.preventDefault();
            return;
          }
          if (target.dataset.action === "choose-sim-day" && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"].indexOf(event.key) !== -1) {
            var focusedDate = dateFromKey(target.dataset.value);
            if (event.key === "PageUp" || event.key === "PageDown") {
              focusedDate = shiftDateMonths(focusedDate, (event.key === "PageUp" ? -1 : 1) * (event.shiftKey ? 12 : 1));
            } else {
              var dayOffset = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
              if (event.key === "Home") { dayOffset = -focusedDate.getDay(); }
              if (event.key === "End") { dayOffset = 6 - focusedDate.getDay(); }
              focusedDate.setDate(focusedDate.getDate() + dayOffset);
            }
            focusDatePickerDay(dateKey(focusedDate));
            event.preventDefault();
            return;
          }
        }
        if (state.activePage !== "simTraffic" && state.activePage !== "simMonthlyTraffic" && state.activePage !== "redlist" && state.activePage !== "resourceHistory") { return; }
        var poolHistory = state.activePage === "resourceHistory";
        var redlist = state.activePage === "redlist";
        var monthly = state.activePage === "simMonthlyTraffic";
        var history = monthly && state.monthlyTrafficTab === "history";
        if (event.key === "Escape" && (state.trafficHistoryInfoOpen || target.closest('[data-action="traffic-history-info"]'))) {
          hideManageStopPopover();
          event.preventDefault();
        } else if (target.dataset.action === "pool-history-mode" && ["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(event.key) !== -1) {
          var poolMode = event.key === "Home" ? "month" : (event.key === "End" ? "year" : (state.resourceHistoryMode === "month" ? "year" : "month"));
          event.preventDefault();
          setResourceHistoryMode(poolMode);
          document.getElementById("poolHistoryTab-" + poolMode).focus();
        } else if (target.dataset.action === "monthly-traffic-tab" && ["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(event.key) !== -1) {
          var tab = event.key === "Home" ? "records" : (event.key === "End" ? "history" : (history ? "records" : "history"));
          event.preventDefault();
          setMonthlyTrafficTab(tab);
          document.getElementById("monthlyTrafficTab-" + tab).focus();
        } else if ((target.dataset.action === "monthly-traffic-month-select" || target.dataset.action === "pool-history-month-select") && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].indexOf(event.key) !== -1) {
          var poolMonth = target.dataset.action === "pool-history-month-select";
          var monthIndex = Number(target.dataset.value.slice(-2)) - 1;
          var offset = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 }[event.key] || 0;
          var nextMonth = event.key === "Home" ? 0 : (event.key === "End" ? 11 : monthIndex + offset);
          if (nextMonth < 0 || nextMonth > 11) {
            if (poolMonth) { state.poolHistoryCalendarYear += nextMonth < 0 ? -1 : 1; }
            else { state.monthlyTrafficCalendarYear += nextMonth < 0 ? -1 : 1; }
            nextMonth = (nextMonth + 12) % 12;
            renderContent();
          }
          var monthPrefix = poolMonth ? "pool-history" : "monthly-traffic";
          var calendarYear = poolMonth ? state.poolHistoryCalendarYear : state.monthlyTrafficCalendarYear;
          document.querySelector('[data-action="' + monthPrefix + '-month-select"][data-value="' + calendarYear + '-' + String(nextMonth + 1).padStart(2, "0") + '"]').focus();
          event.preventDefault();
        } else if (event.key === "Escape" && (state.openCombo || state.openSelect || state.simDateOpen)) {
          var focusKey = state.openCombo;
          var selectKey = state.openSelect;
          var hadDate = state.simDateOpen;
          state.openCombo = "";
          state.openSelect = "";
          state.simDateOpen = false;
          renderContent();
          var dateAction = poolHistory ? "toggle-pool-history-month" : redlist ? (state.dateTarget === "redlistStart" ? "toggle-redlist-start-date" : "toggle-redlist-end-date") :
            (monthly ? "toggle-monthly-traffic-month" : "toggle-sim-traffic-date");
          var returnTarget = focusKey ? document.getElementById(focusKey) :
            document.querySelector(hadDate ? '[data-action="' + dateAction + '"]' : '[data-action="toggle-select"][data-key="' + selectKey + '"]');
          if (returnTarget) { returnTarget.focus(); }
          event.preventDefault();
        } else if ((event.key === "ArrowDown" || event.key === "ArrowUp") && target.closest(".select, .combo")) {
          var container = target.closest(".select, .combo");
          var options = Array.prototype.slice.call(container.querySelectorAll(".select-option"));
          if (!options.length) {
            var controlKey = target.dataset.key;
            target.click();
            var reopened = document.querySelector('#content [data-key="' + controlKey + '"]');
            var firstOption = reopened && reopened.closest(".select, .combo").querySelector(".select-option");
            if (firstOption) { firstOption.focus(); }
            event.preventDefault();
            return;
          }
          var currentIndex = options.indexOf(target);
          var nextIndex = event.key === "ArrowDown" ? (currentIndex + 1) % options.length : (currentIndex <= 0 ? options.length - 1 : currentIndex - 1);
          options[nextIndex].focus();
          event.preventDefault();
        } else if (event.key === "Enter" && target.dataset.action === "pool-history-jump") {
          event.preventDefault();
          var poolPages = Math.max(1, Math.ceil(filteredResourceHistoryRows().length / 20));
          state.resourceHistoryPage[state.resourceHistoryMode] = Math.max(1, Math.min(poolPages, Math.floor(Number(target.value) || 1)));
          renderContent();
        } else if (event.key === "Enter" && target.dataset.action === "redlist-jump") {
          event.preventDefault();
          var redlistPages = Math.max(1, Math.ceil(filteredRedlistRows().length / 20));
          state.redlistPage = Math.max(1, Math.min(redlistPages, Math.floor(Number(target.value) || 1)));
          renderContent();
        } else if (event.key === "Enter" && target.dataset.action === "traffic-history-jump") {
          event.preventDefault();
          var historyPages = Math.max(1, Math.ceil(filteredTrafficHistoryRows().length / 20));
          state.trafficHistoryPage = Math.max(1, Math.min(historyPages, Math.floor(Number(target.value) || 1)));
          renderContent();
        } else if (event.key === "Enter" && target.dataset.action === "monthly-traffic-jump") {
          event.preventDefault();
          var monthlyPages = Math.max(1, Math.ceil(filteredMonthlyTrafficRows().length / 20));
          state.monthlyTrafficPage = Math.max(1, Math.min(monthlyPages, Math.floor(Number(target.value) || 1)));
          renderContent();
        } else if (event.key === "Enter" && target.dataset.action === "sim-traffic-jump") {
          event.preventDefault();
          var totalPages = Math.max(1, Math.ceil(filteredSimTrafficRows().length / state.simTrafficPageSize));
          state.simTrafficPage = Math.max(1, Math.min(totalPages, Math.floor(Number(target.value) || 1)));
          renderContent();
